<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wife Language Translator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffecd2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #ff9a9e;
        }

        button {
            background: linear-gradient(135deg, #ff9a9e, #f67280);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 20px 0;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(246, 114, 128, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result-section {
            background: #fff5f5;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            display: none;
        }

        .result-section.visible {
            display: block;
        }

        .result-label {
            font-weight: 600;
            color: #f67280;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-align: left;
        }

        .result-text {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.6;
            text-align: left;
        }

        .warning-level {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .level-green { background: #d4edda; color: #155724; }
        .level-yellow { background: #fff3cd; color: #856404; }
        .level-orange { background: #ffe0cc; color: #a84300; }
        .level-red { background: #f8d7da; color: #721c24; }

        .examples {
            margin-top: 30px;
            text-align: left;
        }

        .examples h3 {
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .example-chip {
            display: inline-block;
            background: #f0f0f0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #555;
            margin: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .example-chip:hover {
            background: #ffe0e0;
            color: #d44;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wife Language Translator</h1>
        <p class="subtitle">Decode what she <em>really</em> means</p>

        <div class="input-section">
            <label for="input">What did she say?</label>
            <textarea id="input" placeholder='e.g. "I\'m fine"'></textarea>
        </div>

        <button onclick="translate()">Translate</button>

        <div class="result-section" id="result">
            <div class="result-label">Translation:</div>
            <div class="result-text" id="translation"></div>
            <div id="warning"></div>
        </div>

        <div class="examples">
            <h3>Try these:</h3>
            <span class="example-chip" onclick="tryExample(this)">I'm fine</span>
            <span class="example-chip" onclick="tryExample(this)">Do what you want</span>
            <span class="example-chip" onclick="tryExample(this)">We need to talk</span>
            <span class="example-chip" onclick="tryExample(this)">It's okay</span>
            <span class="example-chip" onclick="tryExample(this)">Nothing's wrong</span>
            <span class="example-chip" onclick="tryExample(this)">I don't care</span>
            <span class="example-chip" onclick="tryExample(this)">Who was that?</span>
            <span class="example-chip" onclick="tryExample(this)">I just think it's funny how...</span>
            <span class="example-chip" onclick="tryExample(this)">Five minutes</span>
            <span class="example-chip" onclick="tryExample(this)">Are you really wearing that?</span>
        </div>
    </div>

    <script>
        const translations = [
            {
                patterns: ["i'm fine", "im fine", "i am fine"],
                translation: "I am absolutely NOT fine. You should already know what's wrong, and the fact that you have to ask is making it worse.",
                level: "red",
                levelText: "Danger Level: HIGH"
            },
            {
                patterns: ["do what you want", "do whatever you want"],
                translation: "This is not permission. This is a test. Choose wisely, because there IS a correct answer and it is NOT what you want to do.",
                level: "red",
                levelText: "Danger Level: HIGH"
            },
            {
                patterns: ["we need to talk"],
                translation: "Something serious is on my mind. Clear your schedule, put your phone down, and give me your full attention. This is not optional.",
                level: "orange",
                levelText: "Danger Level: ELEVATED"
            },
            {
                patterns: ["it's okay", "its okay", "it is okay"],
                translation: "It is NOT okay. I'm giving you a chance to reconsider your actions before this escalates significantly.",
                level: "red",
                levelText: "Danger Level: HIGH"
            },
            {
                patterns: ["nothing's wrong", "nothings wrong", "nothing is wrong"],
                translation: "Everything is wrong. I need you to figure out what it is on your own as proof that you actually pay attention to me.",
                level: "red",
                levelText: "Danger Level: HIGH"
            },
            {
                patterns: ["i don't care", "i dont care", "i do not care"],
                translation: "I DO care. Very much. But I want you to make the right decision on your own without me having to spell it out.",
                level: "orange",
                levelText: "Danger Level: ELEVATED"
            },
            {
                patterns: ["who was that", "who is that", "who's that"],
                translation: "I already know exactly who that was. I'm giving you one chance to be honest. Choose your next words very carefully.",
                level: "red",
                levelText: "Danger Level: EXTREME"
            },
            {
                patterns: ["i just think it's funny", "i just think its funny", "it's funny how", "its funny how"],
                translation: "Nothing about this is funny. I am about to present a devastating argument and you will not recover easily.",
                level: "red",
                levelText: "Danger Level: EXTREME"
            },
            {
                patterns: ["five minutes", "5 minutes", "give me five", "give me 5"],
                translation: "I will be ready in 25 to 45 minutes. Do NOT rush me. Use this time to wait patiently and without complaint.",
                level: "green",
                levelText: "Danger Level: LOW"
            },
            {
                patterns: ["are you really wearing that", "you're wearing that", "you gonna wear that"],
                translation: "Go change. That outfit is not acceptable for where we're going. I shouldn't have to tell you this.",
                level: "yellow",
                levelText: "Danger Level: MODERATE"
            },
            {
                patterns: ["whatever"],
                translation: "This argument is over because I've decided I'm right. Continuing to discuss this would be unwise.",
                level: "orange",
                levelText: "Danger Level: ELEVATED"
            },
            {
                patterns: ["wow", "that's nice", "that is nice", "thats nice"],
                translation: "I could not be less interested, but I acknowledge that you are still talking.",
                level: "yellow",
                levelText: "Danger Level: MODERATE"
            },
            {
                patterns: ["thanks", "thank you", "thanks a lot"],
                translation: "Context matters here. If said warmly: genuine gratitude. If said coldly: you have made a terrible mistake.",
                level: "yellow",
                levelText: "Danger Level: CHECK TONE"
            },
            {
                patterns: ["i have a headache", "my head hurts", "headache"],
                translation: "Not tonight. Don't push it.",
                level: "yellow",
                levelText: "Danger Level: MODERATE"
            },
            {
                patterns: ["sure", "sure go ahead"],
                translation: "I'm not happy about it, but I'm letting it happen so I can bring it up later when I need leverage.",
                level: "orange",
                levelText: "Danger Level: ELEVATED"
            },
            {
                patterns: ["i love you"],
                translation: "I genuinely love you! ...but there's a 30% chance a request for something is about to follow.",
                level: "green",
                levelText: "Danger Level: LOW"
            },
            {
                patterns: ["we should", "maybe we should"],
                translation: "We ARE going to. This is not a suggestion. This is a decision that has already been made.",
                level: "yellow",
                levelText: "Danger Level: MODERATE"
            },
            {
                patterns: ["it's up to you", "your call", "your decision"],
                translation: "I already know the right answer. This is your chance to prove we're on the same wavelength. Choose poorly at your own risk.",
                level: "orange",
                levelText: "Danger Level: ELEVATED"
            }
        ];

        function normalize(text) {
            return text.toLowerCase().trim().replace(/[.,!?]+$/g, '');
        }

        function translate() {
            const input = document.getElementById('input').value;
            const resultSection = document.getElementById('result');
            const translationEl = document.getElementById('translation');
            const warningEl = document.getElementById('warning');

            if (!input.trim()) return;

            const normalizedInput = normalize(input);

            let matched = null;
            for (const entry of translations) {
                for (const pattern of entry.patterns) {
                    if (normalizedInput.includes(pattern)) {
                        matched = entry;
                        break;
                    }
                }
                if (matched) break;
            }

            if (matched) {
                translationEl.textContent = matched.translation;
                warningEl.innerHTML = `<span class="warning-level level-${matched.level}">${matched.levelText}</span>`;
            } else {
                translationEl.textContent = "Hmm, I don't have a translation for that one. But if she said it with \"that tone\"... proceed with caution.";
                warningEl.innerHTML = '<span class="warning-level level-yellow">Danger Level: UNKNOWN - STAY ALERT</span>';
            }

            resultSection.classList.add('visible');
        }

        function tryExample(el) {
            document.getElementById('input').value = el.textContent;
            translate();
        }

        document.getElementById('input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                translate();
            }
        });
    </script>
</body>
</html>
